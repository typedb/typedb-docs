<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" class="er" role="img" aria-label="ER diagram: trade_flow relation with roles origin (kabupaten), mill (mill), optional refiner (refinery), exporter and importer (company), destination (country), commodity (commodity), and attributes volume_tonnes, deforestation_ha, usd">
